name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" on GitHub; such a run also keeps Willy's voices to download

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-windows-py313.txt
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libegl1
      - name: Install (Windows, pinned)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt -c constraints-windows-py313.txt ruff
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      # Pose model, hand model and Willy's two voices, so the model and voice tests run.
      - name: Download models and voices
        run: python models/download_models.py
      - name: Tests
        run: python -m pytest -q
      # Every line Willy says, synthesised as the app does (Phase 9.3), so a line the voice can't
      # read fails here. On a manual run, all_fr.wav and all_en.wav (with the time of each line in
      # all_fr.txt and all_en.txt) can be downloaded from the run's page for a week.
      - name: Render Willy's lines
        if: runner.os == 'Linux'
        run: python tools/render_voices.py --out voices
      - name: Keep Willy's voices (manual runs)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: willy-voices
          path: |
            voices/all_*.wav
            voices/all_*.txt
          retention-days: 7
